# --- YOLOv8-seg training args (documentary, 109-class setup) ---

task: segment
mode: train
model: yolov8x-seg.pt
data: configs/dataset.yaml   # <-- on utilise le dataset canonique (109 classes)

epochs: 100
patience: 5
batch: 16
imgsz: 640
device: 0
workers: 8
pretrained: true
seed: 0
deterministic: true
freeze: 5

iou: 0.7
max_det: 300
overlap_mask: true
mask_ratio: 4
retina_masks: false

optimizer: auto
lr0: 0.001
lrf: 0.01
momentum: 0.937
weight_decay: 0.001
warmup_epochs: 3
warmup_momentum: 0.8
warmup_bias_lr: 0.1

box: 7.5
cls: 0.5
dfl: 1.5

hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
translate: 0.1
scale: 0.5
fliplr: 0.5
mosaic: 1.0
mixup: 0.0
auto_augment: randaugment
erasing: 0.4

plots: true
save: true
val: true
